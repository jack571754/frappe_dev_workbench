services:
  frontend:
    volumes:
      - ./overrides/nginx-template.socketio-localfix.conf:/templates/nginx/frappe.conf.template:ro
  websocket:
    environment:
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      http_proxy: ""
      https_proxy: ""
      NO_PROXY: localhost,127.0.0.1,frontend,backend,websocket,db,redis-cache,redis-queue
      no_proxy: localhost,127.0.0.1,frontend,backend,websocket,db,redis-cache,redis-queue
